name: EdgeIDS correctness
on:
  push:
    branches: [revision/ca-edgeids]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,metis]'
      - run: python -m pytest -q
      - run: python -m ca_edgeids demo --out runs/synthetic-ci
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-software-check-not-paper-results
          path: runs/synthetic-ci/paper_outputs/
