[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-edgeids"
version = "0.1.0"
description = "Auditable partitioned edge-level intrusion detection research pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.5", "torch>=2.4", "matplotlib>=3.8"]

[project.optional-dependencies]
metis = ["pymetis>=2023.1"]
test = ["pytest>=8"]

[project.scripts]
ca-edgeids = "ca_edgeids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
